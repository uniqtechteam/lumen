name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Every database test on Linux, once per supported Postgres version: Postgres in a service
  # container, a one-node MongoDB 7 replica set (for transactions) and the real Prisma CLI.
  databases:
    name: Linux, Postgres ${{ matrix.postgres }}, MongoDB 7, Prisma CLI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LUMEN_TEST_POSTGRES_URL: postgres://postgres:lumen@localhost:5432/lumen
      LUMEN_TEST_MONGO_URL: mongodb://localhost:27017/?directConnection=true
      # migrations are also checked against the real Prisma CLI (prisma_interop.rs, corpus.rs)
      LUMEN_TEST_PRISMA: "1"
    steps:
      - uses: actions/checkout@v4
      - name: start MongoDB 7 as a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: databases
          save-if: ${{ matrix.postgres == '17' }}
      - run: cargo test --workspace -- --nocapture

  # macOS and Windows runners have no service containers, so Postgres 17 is installed on the
  # runner itself. MongoDB and the Prisma CLI stay on Linux: the MongoDB tests need a replica set
  # in Docker, which these runners do not have, and neither test depends on the OS.
  postgres-macos:
    name: macOS, Postgres 17
    runs-on: macos-latest
    env:
      LUMEN_TEST_POSTGRES_URL: postgres://postgres:lumen@localhost:5432/lumen
    steps:
      - uses: actions/checkout@v4
      - name: install and start Postgres 17
        run: |
          brew install postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          brew services start postgresql@17
          for i in $(seq 1 30); do "$PG/pg_isready" -h localhost && break; sleep 2; done
          "$PG/createuser" -h localhost -s postgres
          "$PG/psql" -h localhost -d postgres -c "ALTER USER postgres PASSWORD 'lumen'"
          "$PG/createdb" -h localhost -O postgres lumen
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --nocapture

  postgres-windows:
    name: Windows, Postgres 17
    runs-on: windows-latest
    env:
      # the runner image's PostgreSQL service: user postgres, password root
      LUMEN_TEST_POSTGRES_URL: postgres://postgres:root@localhost:5432/lumen
    steps:
      - uses: actions/checkout@v4
      - name: start the preinstalled Postgres
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" -h localhost -t 60
          & "$env:PGBIN\psql.exe" -h localhost -U postgres -c "SELECT version()"
          & "$env:PGBIN\createdb.exe" -h localhost -U postgres lumen
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action adds --all-features by default; check the default feature graph instead, as
          # deny.toml says (the opt-in chrono feature pulls in an unmaintained crate).
          arguments: --workspace

  # Dates are `time` types by default; `chrono` is an opt-in feature of lumen-orm. This job builds
  # and tests the `chrono` side (alone and together with `time`) against Postgres and MongoDB.
  chrono:
    name: chrono feature
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LUMEN_TEST_POSTGRES_URL: postgres://postgres:lumen@localhost:5432/lumen
      LUMEN_TEST_MONGO_URL: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - name: start MongoDB 7 as a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 2; done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p lumen-orm --all-targets --no-default-features --features chrono,mongodb -- -D warnings
      - run: cargo test -p lumen-orm --no-default-features --features chrono,mongodb
      - run: cargo test --workspace --features lumen-orm/chrono
