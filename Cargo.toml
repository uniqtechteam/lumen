[workspace]
resolver = "3"
members = [
    "crates/lumen-orm",
    "crates/lumen-schema",
    "crates/lumen-migrate",
    "crates/lumen-db-codegen",
    "crates/lumen-db-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/lumen"
homepage = "https://github.com/uniqtechteam/lumen"
readme = "README.md"
authors = ["UniqTech <https://uniqtech.dev>"]
keywords = ["orm", "database", "migrations", "postgres", "mongodb"]
categories = ["database"]

[workspace.dependencies]
lumen-schema = { path = "crates/lumen-schema", version = "0.1.1" }
lumen-migrate = { path = "crates/lumen-migrate", version = "0.1.1" }
lumen-orm = { path = "crates/lumen-orm", version = "0.1.1" }
lumen-db-codegen = { path = "crates/lumen-db-codegen", version = "0.1.1" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mongodb = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "derive", "uuid", "rust_decimal"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
