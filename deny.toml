# cargo-deny: licences, advisories, duplicate and unknown sources.
# Default features: the opt-in `chrono` feature of lumen-orm pulls in chrono, which RustSec marks
# unmaintained (RUSTSEC-2026-0543); with the defaults nothing depends on it.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# CC0-1.0 (public domain) and CDLA-Permissive-2.0 (the Mozilla CA list in webpki-roots) come with
# the MongoDB driver; both are permissive.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
