# cargo-deny: licences, advisories, duplicate and unknown sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is marked unmaintained (no vulnerability). sqlx depends on it too, so lumen cannot drop it
    # alone. A `time` or `jiff` option for generated clients is planned for 0.2.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; sqlx needs it; time/jiff option planned for 0.2" },
]

[licenses]
version = 2
# CC0-1.0 (public domain) and CDLA-Permissive-2.0 (the Mozilla CA list in webpki-roots) come with
# the MongoDB driver; both are permissive.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
