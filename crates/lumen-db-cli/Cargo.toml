[package]
name = "lumen-db-cli"
description = "The lumen command: init, format, validate, migrate, db push and generate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["database", "command-line-utilities"]
include = ["src/**/*", "LICENSE-*"]

[[bin]]
name = "lumen"
path = "src/main.rs"

# the same program under a second name, for machines that also have the unrelated `lumen` tool
[[bin]]
name = "lumen-db"
path = "src/main.rs"

[dependencies]
clap.workspace = true
lumen-db-codegen.workspace = true
lumen-migrate.workspace = true
lumen-schema.workspace = true
mongodb.workspace = true
tokio.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile = "3"

[lints]
workspace = true
